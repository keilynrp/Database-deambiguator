name: Security Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Secret scan (blocking) ──────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so gitleaks scans all commits in the PR)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Backend dependency audit (blocking; exceptions via --ignore-vuln) ───
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit (pinned; bump intentionally — see SECURITY_GATES.md)
        run: pip install "pip-audit==2.10.1"

      - name: Audit pinned backend dependencies
        # Ratchet baseline: every --ignore-vuln entry must have a row in
        # docs/operating/SECURITY_GATES.md with justification + expiry.
        # --no-deps: requirements.lock is a flat freeze (no hashes); pip
        # resolver is disabled via --disable-pip so no network lookup needed.
        #
        # Two entries, down from 33. The old list deferred most of its entries
        # to "the upgrade sprint"; #202 was that sprint, and the resulting
        # versions reached or passed every fix version the baseline recorded,
        # so 31 flags were suppressing advisories that no longer applied.
        #
        # These use the canonical IDs pip-audit emits, not CVE aliases. The old
        # list matched via aliases, which is how 34 flags could do two flags'
        # worth of work without anyone noticing: an alias that stops matching
        # fails silently, and a flag that matches nothing looks identical to a
        # flag that is still holding something back.
        run: >-
          pip-audit -r requirements.lock --disable-pip --no-deps
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-1325

  # ── Frontend dependency audit (blocking; allowlist via wrapper) ─────────
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Run npm-audit gate
        working-directory: frontend
        run: npm run audit:gate
